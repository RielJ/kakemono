# cargo-deny: `cargo deny check` (plan §A, §J, risk 11).
# Licenses: permissive only. GPL/LGPL/AGPL are blocked by omission from `allow`
# (Variety, which the Linux backends were modelled on, is GPL-3: no code or dependency from it).

[graph]
# Check every shipped target, not just the host, so per-OS dependencies are covered.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
all-features = true

[advisories]
ignore = [
    # dark-light 3.0 still depends on zbus 5, which pulls the standalone zbus_names/zvariant crates that
    # zbus 6 absorbed. Unmaintained, not vulnerable; no upgrade exists yet. Remove when dark-light moves to zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "zvariant via dark-light -> zbus 5; no upgrade available" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names via dark-light -> zbus 5; no upgrade available" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive via dark-light -> zbus 5; no upgrade available" },
    # Tauri 2 on Linux uses the gtk-rs 0.18 (GTK3) stack, whose glib-macros needs proc-macro-error.
    # Compile-time only, unmaintained not vulnerable; goes away when Tauri moves to GTK4.
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error via tauri -> gtk 0.18 (Linux); compile-time only, no upgrade" },
]

[licenses]
confidence-threshold = 0.8
# BSD-2-Clause and CDLA-Permissive-2.0 are unmatched until the Tauri crate lands (Task 40); expect
# license-not-encountered warnings until then.
allow = [
    "MIT",
    "MIT-0",
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
exceptions = []

[licenses.private]
# Workspace crates are `publish = false` and carry no license field yet.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
# Path dependencies inside the workspace are not wildcards.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
