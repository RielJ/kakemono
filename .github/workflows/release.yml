name: Release

# Plan Task 47. Builds the CLI archives and the Tauri bundles (kakemono-ui
# with the `kakemono` CLI as its sidecar). `workflow_dispatch` only uploads
# workflow artifacts; a `v*` tag also creates a draft GitHub release with
# every artifact and a SHA256SUMS file.
#
# Bundles are unsigned: no Apple Developer ID, notarization or Authenticode
# secrets yet.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  # CLI archives: kakemono-<version>-<target>.tar.gz (zip on Windows).
  cli:
    name: cli (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-cli-${{ matrix.target }}

      # Linux arm64 builds in cross's Docker image. Prebuilt, CI only.
      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build kakemono
        run: >-
          bash scripts/build-sidecar.sh --target "${{ matrix.target }}"
          ${{ matrix.cross && '--cross' || '' }}

      - name: Package
        id: package
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "kakemono") | .version')"
          name="kakemono-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp README.md "dist/$name/"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/kakemono.exe" "dist/$name/"
            (cd dist && 7z a -tzip "$name.zip" "$name" >/dev/null)
            echo "file=dist/$name.zip" >> "$GITHUB_OUTPUT"
          else
            cp "target/${{ matrix.target }}/release/kakemono" "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
            echo "file=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: ${{ steps.package.outputs.file }}
          if-no-files-found: error

  # Tauri bundles: app + dmg (macOS), deb + rpm + AppImage (Linux), msi +
  # nsis (Windows). The `kakemono` sidecar lands beside `kakemono-ui` in
  # each, where `find_cli` and `kakemono pick` look for each other.
  ui:
    name: ui (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system libraries (Tauri/WebKitGTK, AppImage)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf file

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-ui-${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: crates/ui/frontend/package-lock.json

      # Installs the Tauri CLI pinned in package-lock.json (@tauri-apps/cli).
      - name: npm ci
        working-directory: crates/ui/frontend
        run: npm ci

      - name: Build the kakemono sidecar
        run: bash scripts/build-sidecar.sh --target "${{ matrix.target }}"

      # MSI versions are numeric (major.minor.patch), so a pre-release like
      # 0.2.0-beta.1 cannot be used; the MSI gets 0.2.0 instead.
      - name: MSI version
        if: runner.os == 'Windows'
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "kakemono") | .version')"
          core="${version%%[-+]*}"
          conf="$RUNNER_TEMP/wix-version.json"
          printf '{"bundle":{"windows":{"wix":{"version":"%s"}}}}\n' \
            "$core" > "$conf"
          echo "TAURI_EXTRA_CONFIG=--config $conf" >> "$GITHUB_ENV"

      # tauri.bundle.conf.json adds `bundle.externalBin`. It is not in
      # tauri.conf.json because tauri-build would then need the staged
      # sidecar for every plain `cargo build`.
      - name: tauri build
        working-directory: crates/ui/frontend
        env:
          TAURI_APP_PATH: ../src-tauri
        # TAURI_EXTRA_CONFIG is unquoted on purpose: empty, or two words.
        run: >-
          npm run tauri -- build --ci --target "${{ matrix.target }}"
          --config ../src-tauri/tauri.bundle.conf.json $TAURI_EXTRA_CONFIG

      - name: Check the sidecar sits beside kakemono-ui
        run: |
          bundle="target/${{ matrix.target }}/release/bundle"
          case "${{ runner.os }}" in
            macOS)
              test -x "$bundle/macos/kakemono.app/Contents/MacOS/kakemono-ui"
              test -x "$bundle/macos/kakemono.app/Contents/MacOS/kakemono"
              ;;
            Linux)
              deb="$(ls "$bundle"/deb/*.deb)"
              dpkg-deb -c "$deb" | grep -E '\./usr/bin/kakemono$'
              dpkg-deb -c "$deb" | grep -E '\./usr/bin/kakemono-ui$'
              ;;
          esac

      # Without mainBinaryName, the app installs as kakemono.exe and collides
      # with the sidecar. An administrative install unpacks the MSI's files.
      - name: Check the MSI holds kakemono-ui.exe and kakemono.exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundle = "target/${{ matrix.target }}/release/bundle"
          $msi = Get-ChildItem "$bundle/msi/*.msi" | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP "msi"
          $msiArgs = @(
            "/a", "`"$($msi.FullName)`"", "/qn", "TARGETDIR=`"$dir`""
          )
          Start-Process msiexec -ArgumentList $msiArgs -Wait
          foreach ($exe in "kakemono-ui.exe", "kakemono.exe") {
            $found = Get-ChildItem $dir -Recurse -Filter $exe
            if (-not $found) { throw "$exe is not in $($msi.Name)" }
            $found.FullName
          }

      # The .app directory is not uploaded; the dmg carries it.
      - uses: actions/upload-artifact@v4
        with:
          name: ui-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    name: draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [cli, ui]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: SHA256SUMS
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --draft --verify-tag --generate-notes
          --title "kakemono $GITHUB_REF_NAME"
