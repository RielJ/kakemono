name: Release

# Plan Task 47. Builds the CLI archives and the Tauri bundles (kakemono-ui
# with the `kakemono` CLI as its sidecar). `workflow_dispatch` only uploads
# workflow artifacts; a `v*` tag also creates a draft GitHub release with
# every artifact and a SHA256SUMS file.
#
# Asset names carry the OS and arch but no version, so the docs site can link to
# releases/latest/download/<name>:
#   app:  kakemono-<os>-<arch>.dmg | .deb | .rpm | .AppImage | .msi | -setup.exe
#   CLI:  kakemono-cli-<os>-<arch>.tar.gz (.zip on Windows)
# with <os>-<arch> one of macos-arm64, macos-x64, linux-x64, linux-arm64,
# windows-x64 (the matrix `asset` value).
#
# Bundles are unsigned: no Apple Developer ID, notarization or Authenticode
# secrets yet. Updater bundles are signed with the minisign key in the
# TAURI_SIGNING_PRIVATE_KEY secret; tauri.conf.json holds its public key.
# Each updatable asset gets an <asset>.sig, macOS gets
# kakemono-<os>-<arch>.app.tar.gz, and the release gets latest.json
# (scripts/updater-manifest.sh), which installed apps read through
# releases/latest/download/latest.json once the release is published.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  # CLI archives: kakemono-cli-<asset>.tar.gz (zip on Windows).
  cli:
    name: cli (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            asset: macos-arm64
            os: macos-latest
          - target: x86_64-apple-darwin
            asset: macos-x64
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            asset: linux-x64
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            asset: linux-arm64
            os: ubuntu-22.04
            cross: true
          - target: x86_64-pc-windows-msvc
            asset: windows-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-cli-${{ matrix.target }}

      # Linux arm64 builds in cross's Docker image. Prebuilt, CI only.
      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build kakemono
        run: >-
          bash scripts/build-sidecar.sh --target "${{ matrix.target }}"
          ${{ matrix.cross && '--cross' || '' }}

      - name: Package
        id: package
        run: |
          # Asset names leave the version out, so check it here instead.
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "kakemono") | .version')"
          tag="$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF_TYPE" == tag && "$tag" != "v$version" ]]; then
            echo "tag $tag does not match Cargo.toml version $version"
            exit 1
          fi
          name="kakemono-cli-${{ matrix.asset }}"
          mkdir -p "dist/$name"
          cp README.md "dist/$name/"
          # The linter sees the expression text, not the target.
          # shellcheck disable=SC2193
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/kakemono.exe" "dist/$name/"
            (cd dist && 7z a -tzip "$name.zip" "$name" >/dev/null)
            echo "file=dist/$name.zip" >> "$GITHUB_OUTPUT"
          else
            cp "target/${{ matrix.target }}/release/kakemono" "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
            echo "file=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.target }}
          path: ${{ steps.package.outputs.file }}
          if-no-files-found: error

  # Tauri bundles: app + dmg (macOS), deb + rpm + AppImage (Linux), msi +
  # nsis (Windows). The `kakemono` sidecar lands beside `kakemono-ui` in
  # each, where `find_cli` and `kakemono pick` look for each other.
  ui:
    name: ui (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            asset: macos-arm64
            os: macos-latest
          - target: x86_64-apple-darwin
            asset: macos-x64
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            asset: linux-x64
            os: ubuntu-22.04
          - target: x86_64-pc-windows-msvc
            asset: windows-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system libraries (Tauri/WebKitGTK, AppImage)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf file

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-ui-${{ matrix.target }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: crates/ui/frontend/package-lock.json

      # Installs the Tauri CLI pinned in package-lock.json (@tauri-apps/cli).
      - name: npm ci
        working-directory: crates/ui/frontend
        run: npm ci

      - name: Build the kakemono sidecar
        run: bash scripts/build-sidecar.sh --target "${{ matrix.target }}"

      # MSI versions are numeric (major.minor.patch), so a pre-release like
      # 0.2.0-beta.1 cannot be used; the MSI gets 0.2.0 instead.
      - name: MSI version
        if: runner.os == 'Windows'
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "kakemono") | .version')"
          core="${version%%[-+]*}"
          conf="$RUNNER_TEMP/wix-version.json"
          printf '{"bundle":{"windows":{"wix":{"version":"%s"}}}}\n' \
            "$core" > "$conf"
          echo "TAURI_EXTRA_CONFIG=--config $conf" >> "$GITHUB_ENV"

      # tauri.bundle.conf.json adds `bundle.externalBin`. It is not in
      # tauri.conf.json because tauri-build would then need the staged
      # sidecar for every plain `cargo build`. tauri.updater.conf.json turns
      # on the signed updater bundles, which need the private key, so local
      # builds leave it out.
      - name: tauri build
        working-directory: crates/ui/frontend
        env:
          TAURI_APP_PATH: ../src-tauri
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: >-
            ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # TAURI_EXTRA_CONFIG is unquoted on purpose: empty, or two words.
          # shellcheck disable=SC2086
          npm run tauri -- build --ci --target "${{ matrix.target }}" \
            --config ../src-tauri/tauri.bundle.conf.json \
            --config ../src-tauri/tauri.updater.conf.json $TAURI_EXTRA_CONFIG

      - name: Check the sidecar sits beside kakemono-ui
        run: |
          bundle="target/${{ matrix.target }}/release/bundle"
          case "${{ runner.os }}" in
            macOS)
              test -x "$bundle/macos/kakemono.app/Contents/MacOS/kakemono-ui"
              test -x "$bundle/macos/kakemono.app/Contents/MacOS/kakemono"
              ;;
            Linux)
              bash scripts/check-deb.sh "$bundle"
              ;;
          esac

      # The app and its sidecar CLI must both be installed. An administrative
      # install unpacks the MSI's files without installing them.
      - name: Check the MSI holds kakemono-ui.exe and kakemono.exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundle = "target/${{ matrix.target }}/release/bundle"
          $msi = Get-ChildItem "$bundle/msi/*.msi" | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP "msi"
          $msiArgs = @(
            "/a", "`"$($msi.FullName)`"", "/qn", "TARGETDIR=`"$dir`""
          )
          Start-Process msiexec -ArgumentList $msiArgs -Wait
          foreach ($exe in "kakemono-ui.exe", "kakemono.exe") {
            $found = Get-ChildItem $dir -Recurse -Filter $exe
            if (-not $found) { throw "$exe is not in $($msi.Name)" }
            $found.FullName
          }

      # Copies each bundle to dist/kakemono-<asset><suffix>, e.g.
      # kakemono_0.2.0_aarch64.dmg -> kakemono-macos-arm64.dmg, and its
      # updater signature to the same name plus .sig. The .app directory is
      # not uploaded; the dmg carries it, and the updater gets .app.tar.gz.
      - name: Name the bundles
        run: |
          bundle="target/${{ matrix.target }}/release/bundle"
          mkdir -p dist
          shopt -s nullglob
          # Quoted: the globs expand inside the bundle folder, not here.
          for pair in 'dmg/*.dmg:.dmg' 'deb/*.deb:.deb' 'rpm/*.rpm:.rpm' \
            'appimage/*.AppImage:.AppImage' 'msi/*.msi:.msi' \
            'nsis/*.exe:-setup.exe' 'macos/*.app.tar.gz:.app.tar.gz'; do
            # shellcheck disable=SC2206 # the pattern must glob, so no quotes.
            files=("$bundle"/${pair%%:*})
            (( ${#files[@]} == 0 )) && continue
            if (( ${#files[@]} > 1 )); then
              echo "more than one ${pair%%:*}: ${files[*]}"
              exit 1
            fi
            dest="dist/kakemono-${{ matrix.asset }}${pair#*:}"
            cp -- "${files[0]}" "$dest"
            if [[ "${pair#*:}" != .dmg ]]; then
              [[ -s "${files[0]}.sig" ]] || {
                echo "no updater signature ${files[0]}.sig"
                exit 1
              }
              cp -- "${files[0]}.sig" "$dest.sig"
            fi
          done
          ls -l dist

      # Scoop installs the app as a folder, not through an installer: the
      # two programs side by side, as the installers lay them out. The
      # WebView2 runtime ships with Windows 10 and 11.
      - name: Zip the portable app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $release = "target/${{ matrix.target }}/release"
          $dir = Join-Path $env:RUNNER_TEMP "portable"
          New-Item -ItemType Directory -Force $dir | Out-Null
          foreach ($exe in "kakemono-ui.exe", "kakemono.exe") {
            Copy-Item (Join-Path $release $exe) $dir
          }
          Compress-Archive -Path "$dir/*" `
            -DestinationPath "dist/kakemono-${{ matrix.asset }}-portable.zip"
          Get-Item "dist/kakemono-${{ matrix.asset }}-portable.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: ui-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [cli, ui]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # For scripts/updater-manifest.sh.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # The manifest installed apps read to find this release. It fails if
      # an updatable asset or its signature is missing.
      - name: latest.json
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download"
          bash scripts/updater-manifest.sh dist "${GITHUB_REF_NAME#v}" \
            "$base/$GITHUB_REF_NAME"

      - name: SHA256SUMS
        working-directory: dist
        run: |
          ls -l
          sha256sum -- * > SHA256SUMS

      # A download table goes above the generated changelog. The step
      # fails if a linked asset is missing.
      - name: Write the download table
        working-directory: dist
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download"
          base="$base/$GITHUB_REF_NAME"
          for f in kakemono-{macos-arm64,macos-x64}.dmg \
            kakemono-linux-x64.{deb,rpm,AppImage} \
            kakemono-windows-x64{-setup.exe,.msi,-portable.zip} \
            kakemono-cli-{macos-arm64,macos-x64,linux-x64,linux-arm64}.tar.gz \
            kakemono-cli-windows-x64.zip; do
            [[ -e "$f" ]] || { echo "missing asset $f"; exit 1; }
          done
          link() { printf '[%s](%s/%s)' "$2" "$base" "$1"; }
          {
            echo '## Download'
            echo
            echo '| Platform | App (includes the CLI) | CLI only |'
            echo '|---|---|---|'
            echo "| macOS, Apple silicon" \
              "| $(link kakemono-macos-arm64.dmg .dmg)" \
              "| $(link kakemono-cli-macos-arm64.tar.gz .tar.gz) |"
            echo "| macOS, Intel" \
              "| $(link kakemono-macos-x64.dmg .dmg)" \
              "| $(link kakemono-cli-macos-x64.tar.gz .tar.gz) |"
            echo "| Linux, x86_64" \
              "| $(link kakemono-linux-x64.deb .deb)" \
              "· $(link kakemono-linux-x64.rpm .rpm)" \
              "· $(link kakemono-linux-x64.AppImage .AppImage)" \
              "| $(link kakemono-cli-linux-x64.tar.gz .tar.gz) |"
            echo "| Linux, ARM64 | —" \
              "| $(link kakemono-cli-linux-arm64.tar.gz .tar.gz) |"
            echo "| Windows, x64" \
              "| $(link kakemono-windows-x64-setup.exe -setup.exe)" \
              "· $(link kakemono-windows-x64.msi .msi)" \
              "· $(link kakemono-windows-x64-portable.zip 'portable .zip')" \
              "| $(link kakemono-cli-windows-x64.zip .zip) |"
            echo
            # shellcheck disable=SC2016 # literal backticks: Markdown code.
            echo "The builds are not signed. The" \
              "[install guide](https://kakemono.rielj.xyz/install/)" \
              'explains the first-run warning on each system.' \
              '`SHA256SUMS` lists a checksum for every file.'
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --draft --verify-tag --generate-notes
          --notes "$(cat "$RUNNER_TEMP/notes.md")"
          --title "kakemono $GITHUB_REF_NAME"
