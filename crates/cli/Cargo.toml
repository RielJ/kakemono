[package]
name = "wallpaperd"
description = "wallpaperd CLI and headless daemon host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The library holds the commands and daemon so integration tests (tests/server.rs, tests/cli.rs) can reach them.
[lib]
name = "wallpaperd_cli"
path = "src/lib.rs"

[[bin]]
name = "wallpaperd"
path = "src/main.rs"

[dependencies]
wallpaperd-protocol.workspace = true
wallpaperd-config.workspace = true
wallpaperd-sources.workspace = true
wallpaperd-platform.workspace = true
wallpaperd-engine.workspace = true
clap.workspace = true
clap_complete.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true

[target.'cfg(unix)'.dependencies]
nix.workspace = true

[dev-dependencies]
# Test builds of the binary get the fake platform (WALLPAPERD_FAKE_PLATFORM=1, Task 36).
wallpaperd-platform = { workspace = true, features = ["fake"] }
tokio = { workspace = true, features = ["test-util"] }
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
insta.workspace = true

[lints]
workspace = true
