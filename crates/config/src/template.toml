# kakemono configuration file
# Location: ~/.config/kakemono/config.toml ($XDG_CONFIG_HOME/kakemono/config.toml when set;
# %APPDATA%\kakemono\config.toml on Windows). $KAKEMONO_CONFIG or --config overrides it.

[daemon]
# Change the wallpaper automatically every interval. Off by default: the wallpaper changes
# only when you ask (Settings, the menu, `kakemono next`)
# rotation_enabled = false
# How often to rotate the wallpaper (Go duration string: "30m", "1h", "2h30m")
interval = "30m"
# Directory where downloaded wallpapers are cached
download_dir = "~/Pictures/Wallpapers/cache"
# Directory where trashed wallpapers are moved
trash_dir = "~/Pictures/Wallpapers/trash"
# IPC socket path used between the daemon, CLI and UI. Leave unset for the platform default:
# macOS ~/.config/kakemono/kakemono.sock; Linux $XDG_RUNTIME_DIR/kakemono/kakemono.sock
# (~/.config/kakemono/kakemono.sock without XDG_RUNTIME_DIR); Windows the named pipe
# \\.\pipe\kakemono-<user> (this key is ignored there). $KAKEMONO_SOCKET overrides the default.
# socket_path = "~/.config/kakemono/kakemono.sock"
# Pick a new wallpaper when the system switches between light and dark mode
# rotate_on_theme_change = false
# macOS: re-apply the current wallpaper when you switch Spaces
# reapply_on_space_change = false
# Change the wallpaper once when the daemon starts
# change_on_start = false
# Allow online sources (background downloads and on-demand fetches)
# internet = true
# Download new images in the background. When off, Next downloads one image on demand.
# download_enabled = false
# How often to download one new image (Go duration string)
# download_interval = "10m"
# Keep downloaded images under a size limit; the oldest downloads are deleted first
# download_limit_mb_enabled = true
# download_limit_mb = 500
# Folder for dropped and fetched images. Leave unset for <download_dir>/manual
# manual_dir = "~/Pictures/Wallpapers/cache/manual"

# --- Provider settings ---
# Shared by every [[sources]] row of that type.

[bing]
# Bing market code controlling language/region of results
market = "en-US"

[wallhaven]
# Optional Wallhaven API key — without it the provider falls back to HTML scraping
api_key = ""
# Purity filter: "100" = SFW, "110" = SFW+Sketchy, "111" = all
purity = "100"
# Sort order: "random", "toplist", "date_added", "relevance", "views", "favorites", "hot"
sorting = "random"
# Category filter: 3 bits (general/anime/people), "111" = all
categories = "111"

[unsplash]
# Unsplash API access key
access_key = ""

[apod]
# NASA API key — "DEMO_KEY" works for low-volume use
api_key = "DEMO_KEY"

# --- Sources ---
# One [[sources]] block per source. Several blocks of the same type are allowed.
# Without any [[sources]] blocks kakemono uses Wallhaven's hot and top lists and the favorites folder.
# type: wallhaven | unsplash | reddit | bing | apod | folder | images | album-name | album-date
# location: search keywords or URL, a subreddit, a path (~ allowed), or "" for bing and apod.
# id: letters a-z, digits and "-" (at most 32); names the download folder downloads/<id>/.
#
# [[sources]]
# id = "wh-nature"
# enabled = true
# type = "wallhaven"
# location = "nature"
#
# [[sources]]
# id = "pictures"
# enabled = true
# type = "folder"
# location = "~/Pictures/Wallpapers"

# --- Filters ---
# Filters are soft: when no image passes, kakemono uses the image that passes the most filters.
# [filters]
# Only landscape images
# landscape = false
# Only images at least min_size_percent (50, 80 or 100) of the screen size
# min_size_enabled = false
# min_size_percent = 80
# off | dark | light | system (dark images in dark mode, light images in light mode)
# brightness = "off"
# Prefer images whose main colour is close to this "#rrggbb" colour
# color_enabled = false
# color = "#3b82f6"
# Only images with an EXIF/XMP rating of at least min_rating (1-5)
# rating_enabled = false
# min_rating = 4
# Only images whose file name matches this regular expression
# name_regex_enabled = false
# name_regex = ""

# --- Favorites ---

[favorites]
# Directory where favorited wallpapers are copied
dir = "~/Pictures/Wallpapers/favorites"

# --- Picker ---

[picker]
# Position of the floating thumbnail picker: "bottom", "top", "left", "right"
position = "bottom"
# Strip direction: "auto" (vertical on left/right edges), "horizontal" or "vertical"
# orientation = "auto"
# Close the picker when it loses focus
# close_on_blur = true
# Blur NSFW previews (e.g. Wallhaven sketchy/nsfw) until you hover or focus them
# blur_nsfw = true
# Wayland: run the picker under XWayland so it can be positioned (experimental)
# force_x11 = false

# --- Desktop backend ---
# kakemono detects how to set the wallpaper on first run and records the result here.
# Run `kakemono detect` to see what it found, or `kakemono doctor` if setting fails.
#
# [desktop]
# auto | native | gnome | kde | xfce | cinnamon | mate | sway | hyprpaper | awww | swww | swaybg
# | wbg | xwallpaper | feh | nitrogen | hsetroot | pcmanfm | pcmanfm-qt | command
# backend = "auto"
# For "command" (and to override a preset): an argv list, never run through a shell.
# Placeholders: {path}, {uri}, {fit}, {theme}. For shell features use ["sh", "-c", "...", "_", "{path}"].
# set_command = ["awww", "img", "{path}", "--transition-type", "fade"]
# true = the command keeps running (like swaybg); the previous instance is replaced
# persistent = false
# fill | fit | center | stretch | tile
# fit = "fill"
# auto | light | dark — override when the system theme can't be read (e.g. bare X11 window managers)
# theme = "auto"
# "detect" lets re-detection update this section; "user" means never touch it
# managed_by = "detect"

# --- Hooks ---
# Run a command after every wallpaper change (argv list, no shell). It gets KAKEMONO_PATH,
# KAKEMONO_SOURCE, KAKEMONO_TITLE, KAKEMONO_AUTHOR, KAKEMONO_SOURCE_URL and KAKEMONO_THEME
# in its environment, and the same placeholders as set_command.
#
# [hooks]
# on_change = ["sketchybar", "--trigger", "wallpaper_changed"]

# --- Settings window ---
# Keep [ui] last: keys added below it belong to [ui].

[ui]
# Colour scheme of the Settings and Welcome windows: "light", "dark" or "system"
# appearance = "light"
# Open the Welcome window on the next start; it sets this to false once it has shown
show_welcome = true
