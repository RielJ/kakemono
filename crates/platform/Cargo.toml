[package]
name = "kakemono-platform"
description = "kakemono OS seam: wallpaper setters, system signals, main-thread host, argv exec, open/reveal, service install"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Test doubles for downstream crates' tests: `fake::RecordingSetter`, `fake::ManualSignals`,
# `exec::RecordingRunner` and `service::windows::MemoryRunKey`.
fake = []

# No C-building dependencies here: `cargo check -p kakemono-platform --target <other OS>` must work
# from any host (plan §J). Keep reqwest/TLS out of this crate.
[dependencies]
kakemono-config.workspace = true
async-trait.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
url.workspace = true
percent-encoding.workspace = true
dark-light.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation.workspace = true
# NSCell: `NSImageScaling` for the desktop-image options. NSGraphicsContext: the dummy event that
# wakes `NSApplication::run` after `stop:`. objc2-core-foundation: `NSScreen::backingScaleFactor`
# (`screen_size`); already in the lockfile, pure Rust bindings.
objc2-app-kit = { workspace = true, features = ["NSCell", "NSGraphicsContext", "objc2-core-foundation"] }
dispatch2.workspace = true
block2.workspace = true
auto-launch.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows.workspace = true
auto-launch.workspace = true

# `killpg` for a timed-out command's process group (`exec`), persistent setters (Linux).
[target.'cfg(unix)'.dependencies]
# `user`: `getuid` for the launchd domain.
nix = { workspace = true, features = ["user"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus.workspace = true
ashpd.workspace = true
which.workspace = true
# Consumes zbus signal streams (logind `PrepareForSleep`) and dark-light's `stream()`.
futures.workspace = true

[dev-dependencies]
# This crate's own integration tests use the `fake` test doubles.
kakemono-platform = { path = ".", features = ["fake"] }
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
insta.workspace = true

# Fake Plasma / Xfconf / logind services (`#[zbus::interface]`) on a peer-to-peer socket pair in
# tests, so they never touch a real bus.
[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus = { workspace = true, features = ["service", "p2p"] }

# Sets the real wallpaper (then restores it). No libtest harness: AppKit needs the process main
# thread. `main` is a no-op unless it gets `--ignored` AND KAKEMONO_REAL_DESKTOP_TEST=1:
# `KAKEMONO_REAL_DESKTOP_TEST=1 cargo test -p kakemono-platform --test macos_set_roundtrip -- --ignored`
[[test]]
name = "macos_set_roundtrip"
harness = false

[lints]
workspace = true
