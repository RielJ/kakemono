[package]
name = "kakemono-sources"
description = "kakemono image providers (Bing, APOD, Reddit, Unsplash, Wallhaven), local image listing, HTTP retry and download helpers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Test doubles (`fake::StaticProvider`) for downstream crates' tests.
fake = []
# Live provider smoke tests: `cargo test -p kakemono-sources --features live -- --ignored`.
# No code is gated on it yet; CI's nightly job passes it.
live = []

[dependencies]
kakemono-config.workspace = true
async-trait.workspace = true
chrono.workspace = true
tokio.workspace = true
reqwest.workspace = true
scraper.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true
httpdate.workspace = true
rand.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
wiremock.workspace = true
tempfile.workspace = true

[lints]
workspace = true
